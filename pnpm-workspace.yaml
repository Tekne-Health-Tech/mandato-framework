packages:
  - "apps/*"
  - "packages/*"

# Security overrides (CI dependency review). Each names the advisory; remove once the parent ships a fixed range.
overrides:
  # GHSA-g3hv-75wg-m249 (minimatch <11.0.1, ReDoS-style DoS); expo > @expo/fingerprint pins ^10, build-time only.
  # 11.0.5 (2026-11-05) keeps the CommonJS export and the Minimatch class @expo/fingerprint uses.
  "@expo/fingerprint>minimatch": "11.0.5"
