name: Claude review
# Automatic review with Claude Code on the maintainer's Claude subscription
# (secret CLAUDE_CODE_OAUTH_TOKEN, made with `claude setup-token`).
# The "Claude review gate" check passes only when:
#   - the PR touches no sensitive path (same list as .claude/approvals.yml), and
#   - the review found no Important issue (criteria: REVIEW.md, AGENTS.md).
# A ruleset can require this check plus CI; GitHub auto-merge then merges.
# Fork PRs get no secret, so the gate fails for them: they need the maintainer.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  gate:
    name: Claude review gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sensitive paths need the maintainer
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(\.github/|(.*/)?\.claude/|REVIEW\.md$|AGENTS\.md$|CLAUDE\.md$|LICENSE$|NOTICE$|CLA\.md$|CONTRIBUTING\.md$|(.*/)?package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|scripts/|packages/core-contracts/|packages/db/|packages/crypto/|workers/core/crypto/|tests/fixtures/negative/|signatures/)'
          hits=$(git diff --name-only "$BASE" "$HEAD" | grep -E "$pattern" || true)
          if [ -n "$hits" ]; then
            { echo "### Sensitive paths: maintainer review required"; echo '```'; echo "$hits"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this pull request's diff (base ${{ github.event.pull_request.base.sha }}, head ${{ github.event.pull_request.head.sha }}).
            Criteria: REVIEW.md and AGENTS.md at the repository root. Read the surrounding code, not only the diff.
            Post each real problem as an inline comment, starting with "Important:" or "Minor:".
            Important = a bug, a security or privacy problem, or a breach of a hard rule in AGENTS.md or REVIEW.md.
            Do not change any repository file. Finally write the file claude-verdict.json (outside git tracking is fine) with exactly:
            {"important": <number of Important findings>, "summary": "<one sentence>"}
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Write(claude-verdict.json),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"'

      - name: Gate
        env:
          SENSITIVE: ${{ steps.paths.outputs.sensitive }}
        run: |
          test -f claude-verdict.json || { echo "No verdict written: failing closed."; exit 1; }
          cat claude-verdict.json
          important=$(jq -r '.important' claude-verdict.json)
          { echo "### Claude review"; jq -r '"Important findings: \(.important). \(.summary)"' claude-verdict.json; } >> "$GITHUB_STEP_SUMMARY"
          [ "$important" = "0" ] || { echo "Important findings open."; exit 1; }
          [ "$SENSITIVE" = "false" ] || { echo "Sensitive paths: maintainer must merge."; exit 1; }
          echo "Gate passed."
