name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundaries:
    name: Dependency direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/check-boundaries.sh

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Demo tenant is valid (mandato validate)
        run: pnpm mandato validate tenants/demo
      - name: TypeScript contracts compile
        run: npx tsc -p .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Worker dependencies (exact pins, hashes)
        run: pip install --require-hashes -r workers/requirements.txt
      - name: Worker dependency licenses (transitive)
        run: python scripts/check_python_licenses.py
      - name: Python worker contracts
        run: python -m unittest discover -s workers -t . -v
      - name: AI boundary (static, §7.5)
        run: python scripts/check_ai_boundary.py && ! python scripts/check_ai_boundary.py tests/fixtures/negative/ai-boundary

  database:
    name: Database contract (0001)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-trixie@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657   # infra/images/lock.json
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Worker dependencies (exact pins, hashes)
        run: pip install --require-hashes -r workers/requirements.txt
      - name: Adversarial tests (SQL, API, connector kit; database parts mandatory)
        run: packages/db/test/run.sh
      - name: Grant matrix is up to date
        run: packages/db/test/grants.sh > /tmp/grants.md && diff -u packages/db/grants.md /tmp/grants.md
      - name: Demo publication is reproducible from the seed
        run: scripts/publish-demo.sh /tmp/published && diff -r tenants/demo/published /tmp/published

  images:
    name: Images (pinned bases and actions, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every FROM, workflow image and action is pinned
        run: python3 scripts/check_images.py
      - name: Build mandato-worker and mandato-tools
        run: infra/images/build.sh ci
      - name: Images run as non-root
        run: |
          for i in worker tools; do u=$(docker inspect -f '{{.Config.User}}' mandato-$i:ci); echo "$i $u"; [ -n "$u" ] && [ "${u%%:*}" != 0 ] && [ "${u%%:*}" != root ]; done

  supply-chain:
    name: SBOM and vulnerability scan (images)
    runs-on: ubuntu-latest
    env:
      SYFT: anchore/syft@sha256:825cad3a952c87676a6d07e9a3bb05ac9c401d598360070e970aa46d54c1727e    # v1.38.0
      GRYPE: anchore/grype@sha256:e4e8ddb34f01da61a7b25155dcd71a1851802077a564b624c61f2f534d9c9c0b   # v0.104.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Exceptions are well-formed and unexpired
        run: python3 scripts/check_images.py
      - name: Build images
        run: infra/images/build.sh ci
      - name: SBOM (SPDX) for each image
        run: |
          mkdir -p sbom
          for i in worker tools; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT" "mandato-$i:ci" -o spdx-json > "sbom/mandato-$i.spdx.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/
      - name: No critical or high vulnerability with a fix, except listed and unexpired
        run: |
          for i in worker tools; do
            python3 -c "import json,sys; e=[x for x in json.load(open('infra/images/vuln-exceptions.json'))['exceptions'] if x['image']==sys.argv[1]]; print('ignore:'); [print(f'  - vulnerability: {x[\"id\"]}') for x in e]" "$i" > "/tmp/grype-$i.yaml"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "/tmp/grype-$i.yaml:/grype.yaml:ro" "$GRYPE" \
              "mandato-$i:ci" -c /grype.yaml --only-fixed --fail-on high
          done

  network:
    name: Network test (connector release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build images
        run: infra/images/build.sh dev
      - name: infra/compose/test-network.sh
        run: infra/compose/test-network.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --verbose

  licenses:
    name: Dependency licenses
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, MPL-2.0, CC0-1.0, Unlicense, BlueOak-1.0.0, Python-2.0
