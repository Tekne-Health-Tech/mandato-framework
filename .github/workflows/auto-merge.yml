name: Auto-merge
# Turns on GitHub auto-merge (squash) for every non-draft PR opened from a
# branch of this repository. GitHub merges only after every check the main
# ruleset requires is green (CI + "Claude review gate"). A PR that touches a
# sensitive path fails the gate and waits for the maintainer.
# To stop it: disable this workflow, or `gh pr merge --disable-auto <number>`.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
